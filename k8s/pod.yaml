apiVersion: v1
kind: Pod
metadata:
  name: web-app
  labels:
    app: webapp 
spec:
  volumes: 
    - name: shared-storage
      persistentVolumeClaim:
        claimName: shared-logs
    - name: nginx-config-volume
      configMap: 
        name: nginx-configmap
  containers:
    - name: nginx
      image: nginx:1.19
      volumeMounts:
        - name: shared-storage
          mountPath: /usr/share/nginx/html
        - name: nginx-config-volume
          mountPath: /etc/nginx/conf.d
      ports: 
        - containerPort: 80

    - name: logger
      image: busybox
      command: ['sh', '-c', 'while true; do echo "Visited at: $(date)" >> /usr/share/nginx/html/log.txt; sleep 5; done']
      volumeMounts: 
        - name: shared-storage
          mountPath: /usr/share/nginx/html 
